volumes:
  hermes-data:

services:
  hermes:
    image: nousresearch/hermes-agent:latest
    container_name: hermes
    command: gateway run
    restart: unless-stopped
    ports:
      # Dashboard, reachable from this machine only.
      - "127.0.0.1:9119:9119"
    volumes:
      - hermes-data:/opt/data
      # Defaults to the folder containing this repo. Relative paths are
      # resolved by Compose against this file's directory, so this works
      # unchanged from Windows, WSL, Linux and Mac shells alike.
      - ${REPOS_MOUNT:-..}:/repos
    environment:
      HERMES_UID: "10000"
      HERMES_GID: "10000"
      # Run the dashboard inside this container (supervised by s6).
      HERMES_DASHBOARD: "1"
      # The dashboard binds 0.0.0.0 inside the container so Docker can forward
      # to it, and any non-loopback bind requires an auth provider. Set
      # DASHBOARD_PASSWORD in .env; without it the dashboard refuses to start
      # (the gateway still runs fine).
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${DASHBOARD_USER:-hermes}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${DASHBOARD_PASSWORD:-}
