volumes:
  hermes-data:
  repos-data:

services:
  hermes:
    image: nousresearch/hermes-agent:latest
    container_name: hermes
    command: gateway run
    restart: unless-stopped
    ports:
      # Dashboard, reachable from this machine only.
      - "127.0.0.1:9119:9119"
    volumes:
      - hermes-data:/opt/data
      - ${REPOS_MOUNT:-repos-data}:/repos
    environment:
      HERMES_UID: "10000"
      HERMES_GID: "10000"
      # Run the dashboard inside this container (supervised by s6).
      HERMES_DASHBOARD: "1"
      # Required because the dashboard binds 0.0.0.0 inside the container so
      # Docker can forward to it. The published port above is bound to
      # 127.0.0.1, so it is not exposed to the network.
      HERMES_DASHBOARD_INSECURE: "1"
